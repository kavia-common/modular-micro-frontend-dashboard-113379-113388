# SonarQube configuration for Micro Frontend Dashboard

# Project identification (replace placeholder values with your actual project settings)
sonar.projectKey=YOUR_PROJECT_KEY
sonar.organization=YOUR_ORGANIZATION
sonar.host.url=https://sonarcloud.io

# Sources: scan the main dashboard and its frontend modules
sonar.sources=micro_frontend_dashboard/src

# Language
sonar.language=js

# Exclude third-party and build outputs
sonar.exclusions=**/node_modules/**,**/build/**,**/*.test.js,**/public/**

# Encoding of the source files
sonar.sourceEncoding=UTF-8

# Optionally, run coverage reporting (example with Jest)
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
